<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw & Guess Game</title>
  <link rel="stylesheet" href="/styles/global.css">
  <script src="/components/site-header.js" type="module"></script>
  <style>
    .game-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .game-section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .game-section h2 {
      margin-top: 0;
      color: #333;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background: #0056b3;
    }

    .btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    .room-code-display {
      background: #f8f9fa;
      border: 2px solid #007bff;
      border-radius: 4px;
      padding: 1rem;
      margin: 1rem 0;
      text-align: center;
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: bold;
      color: #007bff;
    }

    .connection-status {
      margin-top: 1rem;
      padding: 0.5rem;
      border-radius: 4px;
      text-align: center;
    }

    .connection-status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .connection-status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <site-header active-page="croco"></site-header>

  <main class="game-container">
    <h1>Draw & Guess Game</h1>

    <!-- Create Game Section -->
    <section class="game-section">
      <h2>Create New Game</h2>
      <div class="form-group">
        <label for="playerCount">Number of Players:</label>
        <select id="playerCount">
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
          <option value="5">5 Players</option>
          <option value="6" selected>6 Players</option>
          <option value="7">7 Players</option>
          <option value="8">8 Players</option>
          <option value="9">9 Players</option>
          <option value="10">10 Players</option>
          <option value="11">11 Players</option>
          <option value="12">12 Players</option>
        </select>
      </div>
      <button id="createGameBtn" class="btn">Create New Game</button>

      <div id="roomCodeContainer" class="hidden">
        <p>Your room code is:</p>
        <div id="roomCodeDisplay" class="room-code-display"></div>
        <p>Share this code with other players to join your game.</p>
        <button id="copyCodeBtn" class="btn">Copy Code</button>
      </div>
    </section>

    <!-- Join Game Section -->
    <section class="game-section">
      <h2>Join Existing Game</h2>
      <div class="form-group">
        <label for="roomCode">Room Code:</label>
        <input type="text" id="roomCode" placeholder="Enter room code" maxlength="6">
      </div>
      <button id="joinGameBtn" class="btn" disabled>Join Game</button>

      <div id="connectionStatus" class="connection-status hidden"></div>
    </section>
  </main>

  <script type="module">
    import { GameClient } from '/js/game-client.js';

    document.addEventListener('DOMContentLoaded', () => {
      const gameClient = GameClient.getInstance();

      gameClient.reinitializeUI();

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        window.gameClient = gameClient;
      }
    });
  </script>
</body>

</html>
